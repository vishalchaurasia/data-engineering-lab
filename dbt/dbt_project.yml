
# Name your project! Project names should be lowercase and use underscores as spaces.
name: 'data_engineering_lab'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'data_engineering_lab'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  data_engineering_lab:
    staging:
      materialized: view
    intermediate:
      materialized: table
    marts:
      materialized: table
